name: learnltddexam

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: learnltddexam_sqlserver
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Passw0rd"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data:
    name: learnltddexam_sqlserver_data
